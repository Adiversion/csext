name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          curl -s -L -f "https://jitpack.io/com/github/recloudstream/gradle/-SNAPSHOT/gradle--SNAPSHOT.pom" -o /dev/null || true
          curl -s -L -f "https://jitpack.io/com/github/recloudstream/gradle/-SNAPSHOT/gradle--SNAPSHOT.jar" -o /dev/null || true
          curl -s -L -f "https://jitpack.io/com/github/recloudstream/gradle/-32895aedb6-1/gradle--32895aedb6-1.pom" -o /dev/null || true
          curl -s -L -f "https://jitpack.io/com/github/recloudstream/gradle/-32895aedb6-1/gradle--32895aedb6-1.jar" -o /dev/null || true
          set +e
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt of 4..."
            ./gradlew :AnimePaheProvider:make :WaveFlixProvider:make :IteraPlayProvider:make makePluginsJson --no-daemon --stacktrace 2>&1 | tee build_output.log
            BUILD_STATUS=${PIPESTATUS[0]}
            if [ $BUILD_STATUS -eq 0 ]; then
              echo "Gradle build succeeded on attempt $attempt!"
              break
            fi
            echo "Attempt $attempt failed with code $BUILD_STATUS, waiting 15s before retry..."
            curl -s -L "https://jitpack.io/com/github/recloudstream/gradle/-SNAPSHOT/gradle--SNAPSHOT.pom" -o /dev/null || true
            sleep 15
          done
          set -e
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_STATUS"
            cat build_output.log | tail -n 80
            cp build_output.log $GITHUB_WORKSPACE/builds/build_output.log || true
            cd $GITHUB_WORKSPACE/builds
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add build_output.log
            git commit -m "Build failure log $GITHUB_SHA" || true
            git push origin builds --force || true
            exit $BUILD_STATUS
          fi

          echo "Searching and copying compiled artifacts..."
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true
          find . -type f -name "*.cs3" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          cp $GITHUB_WORKSPACE/builds/AnimePaheProvider.cs3 $GITHUB_WORKSPACE/builds/AnimePahe.cs3 || true
          cp $GITHUB_WORKSPACE/builds/WaveFlixProvider.cs3 $GITHUB_WORKSPACE/builds/WaveFlix.cs3 || true
          cp $GITHUB_WORKSPACE/builds/IteraPlayProvider.cs3 $GITHUB_WORKSPACE/builds/IteraPlay.cs3 || true
          find . -type f -name "plugins.json" -exec cp -v {} $GITHUB_WORKSPACE/builds/ \;
          cp repo.json $GITHUB_WORKSPACE/builds/repo.json || true
          cp icon.png $GITHUB_WORKSPACE/builds/icon.png || true
          cp logo.png $GITHUB_WORKSPACE/builds/logo.png || true
          cp AnimePaheProvider/icon.png $GITHUB_WORKSPACE/builds/AnimePahe_icon.png || true
          cp WaveFlixProvider/icon.png $GITHUB_WORKSPACE/builds/WaveFlix_icon.png || true
          cp IteraPlayProvider/icon.png $GITHUB_WORKSPACE/builds/IteraPlay_icon.png || true
          cp build_output.log $GITHUB_WORKSPACE/builds/build_output.log || true
          echo "Builds contents:"
          ls -la $GITHUB_WORKSPACE/builds/

      - name: Push Builds
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/builds
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit -m "Build $GITHUB_SHA"
            git push origin builds --force
          else
            echo "No changes to push"
          fi

      - name: Push Build Failure Log
        if: failure()
        run: |
          cd $GITHUB_WORKSPACE/builds
          cp $GITHUB_WORKSPACE/src/build_output.log ./build_output.log || true
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add build_output.log
          git commit -m "ci: record build failure log" || true
          git push origin builds --force
